<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="hpGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5B2E" />
      <stop offset="100%" stop-color="#FF844B" />
    </linearGradient>
    <linearGradient id="hpGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="hpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF5B2E" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded hexagon / shield -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#FFF8F3" stroke="#FF5B2E" stroke-width="1.5" stroke-opacity="0.3" />
  
  <!-- Stylized bridge arch and modern 'P'/'H' nodes -->
  <!-- Left pillar -->
  <rect x="10" y="12" width="6" height="24" rx="3" fill="url(#hpGrad2)" />
  
  <!-- Right pillar -->
  <rect x="32" y="12" width="6" height="24" rx="3" fill="url(#hpGrad1)" filter="url(#hpShadow)" />
  
  <!-- Connecting bridge arch / beam -->
  <path d="M13 24 C 18 16, 30 16, 35 24" stroke="url(#hpGrad1)" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M12 28 C 20 23, 28 23, 36 28" stroke="url(#hpGrad2)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
  
  <!-- Center tech node beacon -->
  <circle cx="24" cy="18" r="4" fill="#FF5B2E" filter="url(#hpShadow)" />
  <circle cx="24" cy="18" r="1.8" fill="#FFFFFF" />
</svg>
